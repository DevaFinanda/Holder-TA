name: identia
description: IDentia - Dompet Identitas Digital untuk layanan kesehatan

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0

  # QR Code
  mobile_scanner: ^3.5.5

  # State Management
  provider: ^6.1.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Networking
  http: ^1.1.0
  url_launcher: ^6.2.0
  app_links: ^6.3.4

  # Location & Permission
  geolocator: ^10.1.0
  permission_handler: ^11.1.0

  # Authentication
  local_auth: ^2.3.0

  # Cryptography & JWT
  cryptography: ^2.7.0
  dart_jsonwebtoken: ^2.8.0
  pointycastle: ^3.7.3

  # Utility
  intl: ^0.20.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/Logo 2.png